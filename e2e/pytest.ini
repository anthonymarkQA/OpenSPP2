[pytest]
markers =
    spmis: tests for the SP-MIS product (spp_starter_sp_mis)
    farmer: tests for the Farmer Registry product (spp_starter_farmer_registry)

# Playwright artifacts (trace/video/screenshot) are only kept for failing
# tests, and written under reports/ since that's the one writable mount in
# the e2e-runner container (./e2e itself is mounted read-only).
addopts =
    --tracing=retain-on-failure
    --video=retain-on-failure
    --screenshot=only-on-failure
    --output=reports/artifacts
